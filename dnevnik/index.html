<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#F5F4EF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Дневник записей</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a dotted notebook page; day / week / month spreads as tabs, rapid-log lines with signifiers in a fixed left column */
:root{
  --bg:#F5F4EF; --dot:#D3D1C6; --surface:#FFFFFF; --ink:#1D2033; --muted:#6B6D7A; --line:#E1DFD6;
  --accent:#2E3A8C; --accent-ink:#FFFFFF; --accent-soft:#E3E6F6; --pri:#B4400E; --done:#9A9CA8;
  --f-hand:"Caveat","Segoe Print",cursive;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151C; --dot:#2C2E3A; --surface:#1C1E28; --ink:#E9EAF2; --muted:#9A9DAD; --line:#2E3140;
  --accent:#9AA8F5; --accent-ink:#10132A; --accent-soft:#262C4D; --pri:#F0A060; --done:#6A6D7D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14151C; --dot:#2C2E3A; --surface:#1C1E28; --ink:#E9EAF2; --muted:#9A9DAD; --line:#2E3140;
  --accent:#9AA8F5; --accent-ink:#10132A; --accent-soft:#262C4D; --pri:#F0A060; --done:#6A6D7D; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px, transparent 1.2px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-hand);font-weight:700;font-size:40px;line-height:1}
.links{display:flex;gap:12px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:7px;font-weight:600;color:var(--muted);font-size:15px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:12px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:0}
.btn{border:1px solid var(--ink);background:none;border-radius:10px;padding:9px 13px;font-weight:600}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1 1 120px}
.status{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.status.ok{color:var(--accent)}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button.arrow{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px;flex:none}
.nav .ttl{text-align:center;min-width:0}
.nav .ttl b{font-family:var(--f-hand);font-size:32px;line-height:1;display:block}
.nav .ttl span{font-size:12px;color:var(--muted)}
.today-link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}

/* entry input */
.add{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.add input{flex:1;min-width:0;border:0;background:none;padding:8px 4px;font-size:16px}
.add input:focus{outline:none}
.types{display:flex;gap:2px}
.types button{width:36px;height:36px;border-radius:8px;border:0;background:none;font-size:18px;color:var(--muted);font-weight:700}
.types button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.add .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;width:40px;height:36px;font-size:18px;flex:none}

/* entries */
.entries{display:flex;flex-direction:column}
.e{display:grid;grid-template-columns:30px 1fr;align-items:start;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.e:last-child{border-bottom:0}
.sig{width:30px;height:30px;border:0;background:none;font-size:19px;font-weight:700;line-height:1;display:grid;place-items:center;color:var(--ink);border-radius:8px;font-family:var(--f-num)}
.sig:disabled{cursor:default}
.e .txt{border:0;background:none;padding:4px 0;text-align:left;min-width:0;overflow-wrap:anywhere;font-size:16px}
.e.pri .txt::before{content:"* ";color:var(--pri);font-weight:700}
.e.done .txt{color:var(--done);text-decoration:line-through}
.e.cancelled .txt{color:var(--done);text-decoration:line-through}
.e.migrated .txt,.e.scheduled .txt{color:var(--done)}
.e .meta{display:block;font-size:12px;color:var(--muted)}
.e.event .txt{font-weight:600}
.e.note .txt{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* migration */
.mig{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mig .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:15px}
.mig .row small{color:var(--muted)}
.mig .row .btnrow .btn{flex:none}

/* week & month */
.wday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.wday.today{border-color:var(--accent)}
.wday-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border:0;background:none;width:100%;padding:0;text-align:left}
.wday-h b{font-family:var(--f-hand);font-size:24px;line-height:1.1}
.wday-h span{font-size:12px;color:var(--muted)}
.wday ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.wday li{display:flex;gap:8px}
.wday li i{font-style:normal;font-family:var(--f-num);width:16px;flex:none;text-align:center}
.wday li.x{color:var(--done);text-decoration:line-through}
.focus textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-height:76px;resize:vertical;font-size:15px}
.focus h3,.page h3{font-family:var(--f-hand);font-size:24px;font-weight:700;line-height:1.1}
.cal{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:30px 22px 1fr auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);border-left:0;border-right:0;border-top:0;background:none;width:100%;text-align:left}
.crow .d{font-family:var(--f-num);font-weight:700;text-align:right}
.crow .w{font-size:12px;color:var(--muted)}
.crow .ev{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .c{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.crow.we .w,.crow.we .d{color:var(--pri)}
.crow.today{background:var(--accent-soft);border-radius:6px}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:14px}
.legend span b{font-family:var(--f-num);display:inline-block;width:20px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;width:100%;min-height:70px;font-size:16px;resize:vertical}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn{text-align:left}
.acts .btn.del{border-color:var(--pri);color:var(--pri)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea.mono{font-family:var(--f-num);font-size:12px;min-height:110px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Быстрые записи</div>
    <h1>Дневник</h1>
    <nav class="links"><a href="../">Тренировки →</a><a href="../privychki/">Привычки →</a><a href="../pitanie/">Меню →</a><a href="../slova/">Слова →</a><a href="../grammar/">Грамматика →</a></nav>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-day" aria-selected="true">День</button>
    <button role="tab" id="tab-week" aria-selected="false">Неделя</button>
    <button role="tab" id="tab-month" aria-selected="false">Месяц</button>
    <button role="tab" id="tab-more" aria-selected="false">Ещё</button>
  </div>
  <section id="view-day" class="list"></section>
  <section id="view-week" class="list" hidden></section>
  <section id="view-month" class="list" hidden></section>
  <section id="view-more" class="list" hidden></section>
</div>
<div id="sheet" class="sheet-bg" hidden></div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); };
  const addD = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
  const ym = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
  const addM = (m,n) => { const d=parse(m+'-01'); d.setMonth(d.getMonth()+n); return ym(d); };
  const TODAY = ymd(new Date());
  const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const MONN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1==1)return a;return c;};
  const raw = k => { try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
  const LS = { get:k=>raw('bj-'+k), set(k,v){ try{ localStorage.setItem('bj-'+k, JSON.stringify(v)); }catch(e){} } };

  /* entry: {id, type:'task'|'event'|'note', text, state:'open'|'done'|'migrated'|'scheduled'|'cancelled', pri, date?:'YYYY-MM-DD', month?:'YYYY-MM', to?:string, created} */
  let entries = LS.get('entries');
  if (!entries){ entries = [
    {id:'x1', type:'task', text:'Пример задачи: нажми на точку слева, чтобы отметить', state:'open', pri:false, date:TODAY, created:Date.now()},
    {id:'x2', type:'event', text:'Пример события: тренировка в 19:00', state:'open', pri:false, date:TODAY, created:Date.now()+1},
    {id:'x3', type:'note', text:'Пример заметки. Нажми на текст, чтобы изменить, перенести или удалить', state:'open', pri:false, date:TODAY, created:Date.now()+2}
  ]; LS.set('entries', entries); }
  let notes = LS.get('notes') || {};   // {'W:2026-11-02': text, 'M:2026-11': text}
  const save = () => LS.set('entries', entries);
  const uid = () => 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  let day = TODAY, weekOf = TODAY, month = ym(new Date()), addType = 'task';

  const SIG = {task:{open:'•',done:'×',migrated:'>',scheduled:'<',cancelled:'•'}, event:{open:'○',done:'○',cancelled:'○'}, note:{open:'–',cancelled:'–'}};
  const sig = e => (SIG[e.type]||{})[e.state] || (e.type==='event'?'○':e.type==='note'?'–':'•');
  const forDay = d => entries.filter(e=>e.date===d).sort((a,b)=>a.created-b.created);
  const forMonth = m => entries.filter(e=>e.month===m && !e.date).sort((a,b)=>a.created-b.created);
  function dayTitle(s){ const d=parse(s); return d.getDate()+' '+MON[d.getMonth()]; }
  function relName(s){ return s===TODAY?'Сегодня':s===addD(TODAY,1)?'Завтра':s===addD(TODAY,-1)?'Вчера':WDL[parse(s).getDay()]; }

  function entryHTML(e){
    const canTick = e.type==='task' && (e.state==='open'||e.state==='done');
    const meta = e.state==='migrated' ? 'перенесено на '+(e.to||'') : e.state==='scheduled' ? 'запланировано: '+(e.to||'') : '';
    return `<div class="e ${e.type} ${e.state}${e.pri?' pri':''}"><button class="sig" data-tick="${e.id}" ${canTick?'':'disabled'} aria-label="${canTick?(e.state==='done'?'Снять отметку':'Отметить выполненной'):'Тип записи'}">${sig(e)}</button>
      <button class="txt" data-edit="${e.id}">${esc(e.text)}${meta?`<span class="meta">${esc(meta)}</span>`:''}</button></div>`;
  }
  function addBox(scope){
    return `<div class="add"><div class="types" role="group" aria-label="Тип записи">
        <button data-type="task" aria-pressed="${addType==='task'}" aria-label="Задача">•</button>
        <button data-type="event" aria-pressed="${addType==='event'}" aria-label="Событие">○</button>
        <button data-type="note" aria-pressed="${addType==='note'}" aria-label="Заметка">–</button></div>
      <input id="add-${scope}" placeholder="${addType==='task'?'Новая задача':addType==='event'?'Новое событие':'Новая заметка'}" aria-label="Новая запись" enterkeyhint="done">
      <button class="go" data-add="${scope}" aria-label="Добавить">+</button></div>`;
  }
  function addEntry(scope){
    const inp = $('#add-'+scope), text = inp.value.trim(); if (!text){ inp.focus(); return; }
    const e = {id:uid(), type:addType, text, state:'open', pri:false, created:Date.now()};
    if (scope==='day') e.date = day; else { e.month = month; }
    entries.push(e); save(); render(); const n=$('#add-'+scope); if(n) n.focus();
  }

  /* ---------- day ---------- */
  function renderDay(){
    const list = forDay(day), d = parse(day);
    const open = day===TODAY ? entries.filter(e=>e.type==='task' && e.state==='open' && e.date && e.date<TODAY) : [];
    const monthTasks = day===TODAY ? forMonth(ym(d)).filter(e=>e.type==='task'&&e.state==='open') : [];
    let h = `<div class="nav"><button class="arrow" data-day="-1" aria-label="Предыдущий день">‹</button>
      <div class="ttl"><b>${dayTitle(day)}</b><span>${relName(day)}${day!==TODAY?` · <button class="today-link" data-day="0">к сегодня</button>`:''}</span></div>
      <button class="arrow" data-day="1" aria-label="Следующий день">›</button></div>`;
    if (open.length) h += `<div class="mig"><b>Незакрытые задачи с прошлых дней: ${open.length}</b>
      ${open.slice(0,8).map(e=>`<div class="row"><span>${esc(e.text)}<br><small>${dayTitle(e.date)}</small></span><div class="btnrow"><button class="btn small" data-mig="${e.id}">Сюда</button><button class="btn small" data-x="${e.id}" aria-label="Отменить задачу">✕</button></div></div>`).join('')}
      ${open.length>1?`<button class="btn small" data-migall="1">Перенести все на сегодня</button>`:''}</div>`;
    h += `<div class="page">${list.length?`<div class="entries">${list.map(entryHTML).join('')}</div>`:'<div class="empty">Записей нет. Добавь первую ниже.</div>'}</div>` + addBox('day');
    if (monthTasks.length) h += `<div class="page"><h3>Задачи на ${MONN[d.getMonth()].toLowerCase()}</h3><div class="entries">${monthTasks.map(entryHTML).join('')}</div><p class="hint">Нажми на задачу, чтобы взять её на сегодня.</p></div>`;
    $('#view-day').innerHTML = h;
  }

  /* ---------- week ---------- */
  function monday(s){ const d=parse(s); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); }
  function renderWeek(){
    const m = monday(weekOf), days = Array.from({length:7},(_,i)=>addD(m,i)), last = days[6];
    const all = days.flatMap(forDay), tasks = all.filter(e=>e.type==='task'&&e.state!=='cancelled');
    const done = tasks.filter(e=>e.state==='done').length;
    let h = `<div class="nav"><button class="arrow" data-week="-1" aria-label="Предыдущая неделя">‹</button>
      <div class="ttl"><b>${parse(m).getDate()}–${parse(last).getDate()} ${MON[parse(last).getMonth()]}</b><span>${monday(TODAY)===m?'эта неделя':'неделя'} · задач выполнено ${done}/${tasks.length}${monday(TODAY)!==m?` · <button class="today-link" data-week="0">к этой</button>`:''}</span></div>
      <button class="arrow" data-week="1" aria-label="Следующая неделя">›</button></div>
      <div class="page focus"><h3>Фокус недели</h3><textarea id="note-W" placeholder="Главное на эту неделю: 1–3 пункта">${esc(notes['W:'+m]||'')}</textarea></div>`;
    days.forEach(dd=>{ const l = forDay(dd), d = parse(dd);
      h += `<div class="wday${dd===TODAY?' today':''}"><button class="wday-h" data-open-day="${dd}"><b>${WD[d.getDay()]}, ${d.getDate()}</b><span>${l.length?l.length+' '+plural(l.length,'запись','записи','записей'):'пусто'} →</span></button>
        ${l.length?`<ul>${l.slice(0,6).map(e=>`<li class="${e.state==='done'||e.state==='cancelled'?'x':''}"><i>${sig(e)}</i><span>${esc(e.text)}</span></li>`).join('')}${l.length>6?`<li><i></i><span class="hint">и ещё ${l.length-6}</span></li>`:''}</ul>`:''}</div>`; });
    $('#view-week').innerHTML = h;
  }

  /* ---------- month ---------- */
  function renderMonth(){
    const d0 = parse(month+'-01'), n = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate();
    let h = `<div class="nav"><button class="arrow" data-month="-1" aria-label="Предыдущий месяц">‹</button>
      <div class="ttl"><b>${MONN[d0.getMonth()]}</b><span>${d0.getFullYear()}${month!==ym(new Date())?` · <button class="today-link" data-month="0">к текущему</button>`:''}</span></div>
      <button class="arrow" data-month="1" aria-label="Следующий месяц">›</button></div>
      <div class="page focus"><h3>Цели месяца</h3><textarea id="note-M" placeholder="Что важно в этом месяце">${esc(notes['M:'+month]||'')}</textarea></div>
      <div class="page"><h3>Календарь</h3><div class="cal">`;
    for (let i=1;i<=n;i++){ const ds = month+'-'+pad(i), dd = parse(ds), l = forDay(ds);
      const ev = l.filter(e=>e.type==='event').map(e=>e.text).join(' · ');
      const t = l.filter(e=>e.type==='task'&&e.state!=='cancelled'&&e.state!=='migrated'), td = t.filter(e=>e.state==='done').length;
      h += `<button class="crow${dd.getDay()%6===0?' we':''}${ds===TODAY?' today':''}" data-open-day="${ds}"><span class="d">${i}</span><span class="w">${WD[dd.getDay()]}</span><span class="ev">${esc(ev)}</span><span class="c">${t.length?td+'/'+t.length:''}</span></button>`; }
    const mt = forMonth(month);
    h += `</div><p class="hint">Справа: выполнено задач за день. Нажми на день, чтобы открыть его.</p></div>
      <div class="page"><h3>Задачи месяца</h3>${mt.length?`<div class="entries">${mt.map(entryHTML).join('')}</div>`:'<div class="empty">Сюда пиши то, что нужно сделать в этом месяце, без точного дня.</div>'}</div>` + addBox('month');
    $('#view-month').innerHTML = h;
  }

  /* ---------- actions ---------- */
  function migrateTo(e, date){ const c = {id:uid(), type:e.type, text:e.text, state:'open', pri:e.pri, date, created:Date.now()};
    e.state = 'migrated'; e.to = dayTitle(date); entries.push(c); }
  function scheduleTo(e, m){ const c = {id:uid(), type:e.type, text:e.text, state:'open', pri:e.pri, month:m, created:Date.now()};
    e.state = 'scheduled'; e.to = MONN[parse(m+'-01').getMonth()].toLowerCase(); entries.push(c); }
  function openSheet(id){
    const e = entries.find(x=>x.id===id); if (!e) return;
    const isTask = e.type==='task', open = e.state==='open', tm = addM(e.month || ym(parse(e.date||TODAY)), 1);
    $('#sheet').innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Запись">
      <div class="eyebrow">${e.type==='task'?'Задача':e.type==='event'?'Событие':'Заметка'} · ${e.date?dayTitle(e.date):'задачи месяца'}</div>
      <textarea id="edit-text" aria-label="Текст записи">${esc(e.text)}</textarea>
      <div class="seg" role="group" aria-label="Тип"><button data-settype="task" aria-pressed="${e.type==='task'}">• задача</button><button data-settype="event" aria-pressed="${e.type==='event'}">○ событие</button><button data-settype="note" aria-pressed="${e.type==='note'}">– заметка</button></div>
      <div class="acts">
        ${isTask&&open?`<button class="btn" data-s="done">× Выполнено</button>`:''}
        ${isTask&&e.state!=='open'?`<button class="btn" data-s="reopen">• Вернуть в работу</button>`:''}
        ${open&&!e.date?`<button class="btn" data-s="today">На сегодня</button>`:''}
        ${open&&e.date?`<button class="btn" data-s="tomorrow">&gt; На ${e.date===TODAY?'завтра':'следующий день'}</button>`:''}
        ${open&&e.date&&e.date<TODAY?`<button class="btn" data-s="today">&gt; На сегодня</button>`:''}
        ${open?`<button class="btn" data-s="month">&lt; В ${MONN[parse(tm+'-01').getMonth()].toLowerCase()}</button>`:''}
        <button class="btn" data-s="pri">${e.pri?'Снять приоритет':'* Важно'}</button>
        ${e.state!=='cancelled'?`<button class="btn" data-s="cancel">Неактуально</button>`:''}
        <button class="btn del" data-s="del">Удалить</button>
      </div>
      <button class="btn acc" data-s="save">Сохранить и закрыть</button></div>`;
    $('#sheet').hidden = false; $('#sheet').dataset.id = id;
  }
  $('#sheet').addEventListener('click', ev=>{
    const el = $('#sheet'); if (ev.target===el){ el.hidden=true; return; }
    const e = entries.find(x=>x.id===el.dataset.id); if (!e) return;
    const t = ev.target.closest('[data-settype]'); if (t){ e.type = t.dataset.settype; if (e.type!=='task' && e.state==='done') e.state='open'; save(); openSheet(e.id); render(); return; }
    const b = ev.target.closest('[data-s]'); if (!b) return; const a = b.dataset.s;
    const txt = $('#edit-text').value.trim(); if (txt) e.text = txt;
    if (a==='done') e.state = 'done';
    if (a==='reopen') e.state = 'open';
    if (a==='tomorrow') migrateTo(e, addD(e.date, 1));
    if (a==='today') migrateTo(e, TODAY);
    if (a==='month') scheduleTo(e, addM(e.month || ym(parse(e.date||TODAY)), 1));
    if (a==='pri'){ e.pri = !e.pri; save(); openSheet(e.id); render(); return; }
    if (a==='cancel') e.state = 'cancelled';
    if (a==='del'){ if (!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Точно удалить?'; return; } entries = entries.filter(x=>x!==e); }
    save(); el.hidden = true; render();
  });
  document.addEventListener('keydown', e=>{ if (e.key==='Escape') $('#sheet').hidden = true; });

  function onClick(ev){
    const tp = ev.target.closest('[data-type]'); if (tp){ addType = tp.dataset.type; const v=$('#add-day')||$('#add-month'); const keep = v?v.value:''; render(); const n=$('#add-day')||$('#add-month'); if(n){ n.value=keep; n.focus(); } return; }
    const ad = ev.target.closest('[data-add]'); if (ad){ addEntry(ad.dataset.add); return; }
    const tk = ev.target.closest('[data-tick]'); if (tk){ const e = entries.find(x=>x.id===tk.dataset.tick); if (e && e.type==='task'){ e.state = e.state==='done'?'open':'done'; save(); render(); } return; }
    const ed = ev.target.closest('[data-edit]'); if (ed){ openSheet(ed.dataset.edit); return; }
    const mg = ev.target.closest('[data-mig]'); if (mg){ migrateTo(entries.find(x=>x.id===mg.dataset.mig), TODAY); save(); render(); return; }
    const x = ev.target.closest('[data-x]'); if (x){ entries.find(e=>e.id===x.dataset.x).state='cancelled'; save(); render(); return; }
    if (ev.target.closest('[data-migall]')){ entries.filter(e=>e.type==='task'&&e.state==='open'&&e.date&&e.date<TODAY).forEach(e=>migrateTo(e,TODAY)); save(); render(); return; }
    const dn = ev.target.closest('[data-day]'); if (dn){ const k=+dn.dataset.day; day = k===0?TODAY:addD(day,k); renderDay(); return; }
    const wn = ev.target.closest('[data-week]'); if (wn){ const k=+wn.dataset.week; weekOf = k===0?TODAY:addD(weekOf,7*k); renderWeek(); return; }
    const mn = ev.target.closest('[data-month]'); if (mn){ const k=+mn.dataset.month; month = k===0?ym(new Date()):addM(month,k); renderMonth(); return; }
    const od = ev.target.closest('[data-open-day]'); if (od){ day = od.dataset.openDay; show('day'); return; }
  }
  ['#view-day','#view-week','#view-month'].forEach(s=>{
    $(s).addEventListener('click', onClick);
    $(s).addEventListener('keydown', ev=>{ if (ev.key==='Enter' && /^add-/.test(ev.target.id||'')){ ev.preventDefault(); addEntry(ev.target.id.slice(4)); } });
  });
  let noteTimer = null;
  document.addEventListener('input', ev=>{
    const id = ev.target.id; if (id!=='note-W' && id!=='note-M') return;
    const key = id==='note-W' ? 'W:'+monday(weekOf) : 'M:'+month;
    notes[key] = ev.target.value; clearTimeout(noteTimer); noteTimer = setTimeout(()=>LS.set('notes',notes), 400);
  });

  /* ---------- more ---------- */
  let moreMsg = ['',''];
  function exportText(){
    const from = addD(TODAY,-13), list = entries.filter(e=>(e.date&&e.date>=from&&e.date<=addD(TODAY,30)) || (e.month&&!e.date&&e.month>=ym(new Date())));
    const lines = ['ДНЕВНИК · выгрузка для Claude', 'Выгружено: '+new Date().toLocaleString('ru-RU'), ''];
    const wk = notes['W:'+monday(TODAY)], mo = notes['M:'+ym(new Date())];
    if (wk) lines.push('Фокус недели: '+wk); if (mo) lines.push('Цели месяца: '+mo); if (wk||mo) lines.push('');
    const byDay = {}; list.filter(e=>e.date).forEach(e=>(byDay[e.date] ||= []).push(e));
    Object.keys(byDay).sort().forEach(d=>{ lines.push('■ '+d+' ('+WD[parse(d).getDay()]+')'); byDay[d].forEach(e=>lines.push('  '+sig(e)+' '+(e.pri?'* ':'')+e.text+(e.state==='cancelled'?' (неактуально)':''))); });
    const mt = list.filter(e=>!e.date); if (mt.length){ lines.push('■ Задачи месяца'); mt.forEach(e=>lines.push('  '+sig(e)+' '+e.text+' ['+e.month+']')); }
    lines.push('', 'Ключ: • задача, × выполнена, > перенесена, < в месяц, ○ событие, – заметка');
    return lines.join('\n');
  }
  function renderMore(){
    $('#view-more').innerHTML = `<div class="page"><h3>Ключ</h3><div class="legend">
        <span><b>•</b> задача</span><span><b>×</b> выполнена</span><span><b>&gt;</b> перенесена на день</span><span><b>&lt;</b> перенесена в месяц</span>
        <span><b>○</b> событие</span><span><b>–</b> заметка</span><span><b style="color:var(--pri)">*</b> важно</span><span><s>текст</s> неактуально</span></div>
        <p class="hint">Пиши коротко, одной строкой. Каждое утро на странице «День» появятся незакрытые задачи с прошлых дней: перенеси нужные на сегодня, а лишние отметь как неактуальные. Задачи без точной даты пиши на странице «Месяц».</p></div>
      <div class="page"><h3>Отправить Claude</h3><p class="hint">Записи за 2 недели, ближайшие планы и цели. Помогу расставить приоритеты или разобрать неделю.</p>
        <textarea class="mono" readonly id="export-text" aria-label="Выгрузка">${esc(exportText())}</textarea>
        <div class="btnrow">${navigator.share?'<button class="btn acc" data-m="share">Поделиться</button>':''}<button class="btn" data-m="copy">Скопировать</button></div></div>
      <div class="page"><h3>Резервная копия</h3><p class="hint">Записи хранятся только на этом телефоне. Чтобы восстановить, вставь содержимое файла сюда.</p>
        <textarea class="mono" id="import-text" placeholder='{"entries": [ … ]}' aria-label="Восстановить из копии"></textarea>
        <div class="btnrow"><button class="btn" data-m="backup">Скачать копию</button><button class="btn" data-m="import">Восстановить</button></div></div>
      <div class="status ${moreMsg[1]}" id="more-status">${esc(moreMsg[0])}</div>`;
    moreMsg = ['',''];
  }
  function setMore(t,c){ const e=$('#more-status'); if(e){ e.textContent=t; e.className='status '+c; } }
  function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
  $('#view-more').addEventListener('click', async ev=>{
    const b = ev.target.closest('[data-m]'); if (!b) return; const a = b.dataset.m;
    if (a==='share'){ try{ await navigator.share({title:'Дневник', text:exportText()}); setMore('Отправлено.','ok'); }catch(e){ if(e&&e.name!=='AbortError') setMore('Не получилось. Нажми «Скопировать».',''); } }
    if (a==='copy'){ try{ await navigator.clipboard.writeText(exportText()); setMore('Скопировано.','ok'); }catch(e){ const t=$('#export-text'); t.focus(); t.select(); setMore('Текст выделен, скопируй вручную.',''); } }
    if (a==='backup'){ download('dnevnik-backup-'+TODAY+'.json', JSON.stringify({entries, notes})); setMore('Копия сохранена.','ok'); }
    if (a==='import'){ const s=$('#import-text').value, i=s.indexOf('{'), j=s.lastIndexOf('}');
      try{ const o = JSON.parse(s.slice(i,j+1)); if (!Array.isArray(o.entries)) throw 0;
        const ids = new Set(entries.map(e=>e.id)); o.entries.forEach(e=>{ if(e&&e.id&&!ids.has(e.id)) entries.push(e); }); if (o.notes) notes = Object.assign(notes, o.notes);
        save(); LS.set('notes',notes); moreMsg=['Восстановлено записей: '+o.entries.length+'.','ok']; renderMore(); }
      catch(e){ setMore('Не получилось прочитать копию. Вставь файл целиком.',''); } }
  });

  /* ---------- nav ---------- */
  const tabs = ['day','week','month','more']; let cur = 'day';
  function render(){ if (cur==='day') renderDay(); if (cur==='week') renderWeek(); if (cur==='month') renderMonth(); if (cur==='more') renderMore(); }
  function show(t){ if (t!==cur) addType = 'task'; cur = t; tabs.forEach(o=>{ $('#tab-'+o).setAttribute('aria-selected', o===t); $('#view-'+o).hidden = o!==t; }); render(); window.scrollTo(0,0); }
  tabs.forEach(t=>$('#tab-'+t).addEventListener('click',()=>show(t)));
  show('day');
  if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
