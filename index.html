<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#EEF1F4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Дневник тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like a coach's clipboard — plan on top, sets as tappable counters, history below a tab switch */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202A; --muted:#5E6B78; --line:#D8DEE5;
  --accent:#2448D8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FD;
  --done:#1E8A5A; --done-soft:#DDF2E7; --warn:#B4580E;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E8EDF2; --muted:#93A1AE; --line:#2A3542;
  --accent:#7D98FF; --accent-ink:#0B1020; --accent-soft:#1F2A4D;
  --done:#4CC98A; --done-soft:#173628; --warn:#F0A060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E8EDF2; --muted:#93A1AE; --line:#2A3542;
  --accent:#7D98FF; --accent-ink:#0B1020; --accent-soft:#1F2A4D;
  --done:#4CC98A; --done-soft:#173628; --warn:#F0A060; color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15}
.streak{display:flex;align-items:baseline;gap:6px}
.streak b{font-family:var(--f-display);font-size:30px;color:var(--accent);line-height:1}
.streak span{font-size:13px;color:var(--muted)}

.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip i{display:block;aspect-ratio:1;border-radius:4px;background:var(--line);max-width:100%}
.strip i.on{background:var(--done)}
.strip i.today{outline:2px solid var(--accent);outline-offset:1px}
.strip-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.coach{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.coach h2{font-family:var(--f-display);font-weight:500;font-size:17px}
.coach p{margin:0;font-size:14px;opacity:.92}
.coach .meta{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;font-weight:600}

.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.complete{border-color:var(--done)}
.ex-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-name{font-weight:700;font-size:16px;min-width:0;flex:1;border:0;background:none;padding:0}
.ex-target{font-size:13px;color:var(--muted)}
.ex-tip{font-size:13px;color:var(--muted);margin:0}
.iconbtn{border:1px solid var(--line);background:none;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none;font-size:16px;line-height:1}
.sets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.set{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.set.done{background:var(--done-soft);border-color:var(--done)}
.set input{width:46px;border:0;background:none;text-align:center;padding:8px 2px;font-family:var(--f-num);font-weight:700;font-size:16px}
.set button{border:0;background:none;padding:8px 10px;font-size:13px;color:var(--muted);border-left:1px solid var(--line)}
.set.done button{color:var(--done);font-weight:700}
.unit{font-size:12px;color:var(--muted)}
.addset{border:1px dashed var(--line);background:none;border-radius:10px;padding:8px 12px;color:var(--muted);font-size:13px}
.row2{display:grid;grid-template-columns:110px 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}

.add-ex{display:flex;gap:8px;flex-wrap:wrap}
.add-ex input{flex:1 1 200px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.btn{border:1px solid var(--ink);background:none;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);width:100%;padding:14px;font-size:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:14px;font-weight:700}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button b{font-family:var(--f-num);font-size:16px}
.scale button span{font-size:10px;color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale button[aria-pressed="true"] span{color:var(--accent-ink)}

.status{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.status.ok{color:var(--done)} .status.err{color:var(--warn)}
.notice{font-size:13px;color:var(--warn);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);text-align:center}

.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.day-head b{font-weight:700}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.day ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.day li{display:flex;justify-content:space-between;gap:10px}
.day li span:last-child{color:var(--muted);text-align:right}
.day .comment{font-size:13px;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:8px}
.week{display:flex;flex-direction:column;gap:6px}
.week div{display:flex;gap:10px;font-size:14px}
.week div b{width:28px;flex:none;color:var(--muted);font-weight:600}
.week div.cur b,.week div.cur span{color:var(--accent);font-weight:700}
.fig{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 10px}
.fig svg{width:160px;max-width:48%;height:auto;flex:none}
.figside{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.figside a{color:var(--accent);font-weight:600;text-decoration:none}
.figside a:hover{text-decoration:underline}
.coachbox textarea{font-family:var(--f-num);font-size:12px;min-height:120px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1 1 140px}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.ex,.set{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="today-label">Сегодня</div>
      <h1>Дневник тренировок</h1>
      <span style="display:flex;gap:12px;flex-wrap:wrap"><a href="pitanie/" style="font-size:13px;font-weight:600;color:var(--accent);text-decoration:none">Меню на неделю →</a><a href="privychki/" style="font-size:13px;font-weight:600;color:var(--accent);text-decoration:none">Привычки →</a></span>
    </div>
    <div class="streak"><b class="num" id="streak">0</b><span id="streak-word">дней подряд</span></div>
  </header>

  <div>
    <div class="strip" id="strip" aria-label="Последние 14 дней"></div>
    <div class="strip-legend"><span>2 недели назад</span><span>сегодня</span></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true">Сегодня</button>
    <button role="tab" id="tab-history" aria-selected="false">История</button>
    <button role="tab" id="tab-week" aria-selected="false">Неделя</button>
    <button role="tab" id="tab-coach" aria-selected="false">Тренер</button>
  </div>

  <div id="notice" class="notice" hidden></div>

  <section id="view-today" class="list"></section>
  <section id="view-history" class="list" hidden></section>
  <section id="view-week" class="list" hidden></section>
  <section id="view-coach" class="list coachbox" hidden></section>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const TODAY = ymd(new Date());
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const nice = s => { const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return d+' '+MONTHS[m-1]+', '+WDL[dt.getDay()]; };
  const plural = (n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1==1)return a;return c;};
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  $('#today-label').textContent = nice(TODAY);

  let db = null, plan = null, logs = {}, draft = null, dirty = false, saving = false;
  const FEEL = [['1','очень легко'],['2','легко'],['3','норм'],['4','тяжело'],['5','на пределе']];

  /* ---------- local fallback ---------- */
  const LS = {
    get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };

  /* ---------- draft ---------- */
  function draftFrom(src, fromLog){
    const exs = (src && src.exercises) || [];
    return {
      exercises: exs.map(e => ({
        name: e.name||'Упражнение', fig: e.fig||'',
        unit: e.unit||'повт',
        target: e.target || (e.sets && !Array.isArray(e.sets) ? e.sets : ''),
        tip: e.tip||'',
        weight: e.weight||'',
        note: fromLog ? (e.note||'') : '',
        sets: fromLog && Array.isArray(e.sets)
          ? e.sets.map(s=>({v:s.v, done:!!s.done}))
          : Array.from({length: Number(e.setCount)||3}, ()=>({v: Number(e.reps)||10, done:false}))
      })),
      feeling: fromLog ? (src.feeling||'') : '',
      comment: fromLog ? (src.comment||'') : ''
    };
  }
  function ensureDraft(){
    if (draft) return;
    const local = LS.get('draft-'+TODAY);
    if (logs[TODAY]) draft = draftFrom(logs[TODAY], true);
    else if (local) draft = local;
    else { const P = getActive(); if (P) draft = draftFrom(P, false); }
  }
  function touch(){ dirty = true; LS.set('draft-'+TODAY, draft); setStatus('Есть несохранённые изменения',''); }

  /* ---------- render: today ---------- */
  let statusMsg = ['',''];
  function setStatus(t,c){ statusMsg=[t,c]; const el=$('#status'); if(el){el.textContent=t; el.className='status '+c;} }

  function renderToday(){
    const plan = getActive();
    const v = $('#view-today');
    ensureDraft();
    let h = '';
    if (plan){
      h += `<div class="coach"><div class="meta">${esc(plan.dayLabel||'План на сегодня')}${plan.duration?' · '+esc(plan.duration):''}</div>
        <h2>${esc(plan.title||'Тренировка')}</h2>${plan.note?`<p>${esc(plan.note)}</p>`:''}
        ${plan.date && plan.date!==TODAY?`<p><b>План от ${esc(nice(plan.date))}.</b> Напиши тренеру в чат за новым.</p>`:''}</div>`;
    }
    if (!draft){
      h += `<div class="empty">План на сегодня появится здесь, как только тренер его пришлёт. А пока можно добавить упражнение самому ↓</div>`;
      draft = {exercises:[],feeling:'',comment:''};
    }
    draft.exercises.forEach((e,i)=>{
      const allDone = e.sets.length && e.sets.every(s=>s.done);
      h += `<article class="ex${allDone?' complete':''}" data-i="${i}">
        <div class="ex-top">
          <div style="min-width:0;flex:1">
            <input class="ex-name" id="name-${i}" value="${esc(e.name)}" aria-label="Название упражнения" data-k="name">
            ${e.target?`<div class="ex-target">План: <span class="num">${esc(e.target)}</span></div>`:''}
          </div>
          <button class="iconbtn" data-act="del" title="Убрать упражнение" aria-label="Убрать упражнение">×</button>
        </div>
        ${e.tip?`<p class="ex-tip">${esc(e.tip)}</p>`:''}
        ${figHTML(e)}
        <div class="sets">
          ${e.sets.map((s,j)=>`<div class="set${s.done?' done':''}">
            <input id="s-${i}-${j}" class="num" inputmode="numeric" value="${esc(s.v)}" data-set="${j}" aria-label="Подход ${j+1}, ${esc(e.unit)}">
            <button data-act="toggle" data-set="${j}" aria-label="Отметить подход ${j+1}">${s.done?'✓':j+1}</button></div>`).join('')}
          <button class="addset" data-act="addset">+ подход</button>
          ${e.sets.length?`<button class="addset" data-act="rmset">− подход</button>`:''}
          <span class="unit">${esc(e.unit)}</span>
        </div>
        <div class="row2">
          <div class="field"><label for="w-${i}">Вес / резинка</label><input id="w-${i}" data-k="weight" value="${esc(e.weight)}" placeholder="напр. 4 кг"></div>
          <div class="field"><label for="n-${i}">Заметка</label><input id="n-${i}" data-k="note" value="${esc(e.note)}" placeholder="как зашло, что заменил"></div>
        </div>
      </article>`;
    });
    h += `<div class="add-ex">
        <input id="new-ex" placeholder="Добавить своё упражнение">
        <button class="btn" data-act="addex">Добавить</button></div>
      <div class="panel">
        <h3>Как ощущалось?</h3>
        <div class="scale">${FEEL.map(([n,t])=>`<button data-act="feel" data-v="${n}" aria-pressed="${draft.feeling===n}"><b>${n}</b><span>${t}</span></button>`).join('')}</div>
        <div class="field"><label for="comment">Комментарий тренеру</label>
          <textarea id="comment" placeholder="Что было тяжело, что болело, что хочешь поменять">${esc(draft.comment)}</textarea></div>
      </div>
      <button class="btn primary" data-act="save">${logs[TODAY]?'Обновить запись':'Сохранить тренировку'}</button>
      <div id="status" class="status ${statusMsg[1]}">${esc(statusMsg[0])}</div>`;
    v.innerHTML = h;
    setupFigs();
  }

  /* ---------- exercise figures ---------- */
  const FIGS = {
    squat:{cue:'Таз назад и вниз, пятки на полу, грудь раскрыта',db:true,
      a:{head:[101,13],sh:[100,26],el:[108,40],ha:[103,32],hi:[100,60],kn:[101,86],an:[100,112]},
      b:{head:[99,43],sh:[96,56],el:[110,68],ha:[105,60],hi:[82,90],kn:[120,94],an:[100,112]}},
    pushup:{cue:'Опускай грудь к полу, локти примерно под 45° к телу',
      a:{head:[153,66],sh:[140,72],el:[141,92],ha:[141,112],hi:[88,98],kn:[62,112],an:[44,100]},
      b:{head:[154,95],sh:[140,98],el:[124,100],ha:[141,112],hi:[90,106],kn:[62,112],an:[44,100]}},
    row:{cue:'Тяни локоть к поясу, спина ровная, вторая рука на стуле',db:true,chair:true,
      a:{head:[134,49],sh:[120,54],el:[121,74],ha:[121,92],el2:[136,66],ha2:[150,78],hi:[72,62],kn:[76,88],an:[70,112]},
      b:{head:[134,49],sh:[120,54],el:[104,54],ha:[106,72],el2:[136,66],ha2:[150,78],hi:[72,62],kn:[76,88],an:[70,112]}},
    bridge:{cue:'Упирайся пятками и поднимай таз до прямой линии',
      a:{head:[22,102],sh:[38,108],el:[62,111],ha:[84,111],hi:[92,108],kn:[124,84],an:[140,112]},
      b:{head:[22,102],sh:[38,108],el:[62,111],ha:[84,111],hi:[98,82],kn:[128,80],an:[140,112]}},
    plank:{cue:'Держи прямую линию от плеч до пяток и дыши ровно',slow:true,
      a:{head:[153,79],sh:[140,84],el:[140,112],ha:[160,112],hi:[94,92],kn:[62,101],an:[30,110]},
      b:{head:[153,78],sh:[140,83],el:[140,112],ha:[160,112],hi:[94,89],kn:[62,100],an:[30,110]}},
    lunge:{cue:'Опускайся вертикально, переднее колено над стопой, заднее почти касается пола',db:true,
      a:{head:[104,15],sh:[104,28],el:[105,44],ha:[105,60],hi:[104,60],kn:[116,85],an:[126,112],kn2:[88,84],an2:[70,108]},
      b:{head:[96,35],sh:[96,48],el:[97,64],ha:[97,80],hi:[96,80],kn:[124,82],an:[126,112],kn2:[92,106],an2:[70,108]}},
    rdl:{cue:'Уводи таз назад, спина прямая, гантели скользят вдоль ног',db:true,
      a:{head:[100,13],sh:[100,26],el:[101,43],ha:[101,58],hi:[100,60],kn:[102,86],an:[100,112]},
      b:{head:[128,42],sh:[116,46],el:[116,62],ha:[116,80],hi:[84,58],kn:[96,86],an:[100,112]}},
    deadbug:{cue:'Поясница прижата к полу, рука и противоположная нога уходят медленно',
      a:{head:[30,100],sh:[44,104],el:[46,88],ha:[48,72],el2:[46,88],ha2:[48,72],hi:[84,104],kn:[86,80],an:[106,80],kn2:[86,80],an2:[106,80]},
      b:{head:[30,100],sh:[44,104],el:[28,102],ha:[12,100],el2:[46,88],ha2:[48,72],hi:[84,104],kn:[112,100],an:[138,102],kn2:[86,80],an2:[106,80]}},
    sideplank:{cue:'Локоть под плечом, таз держи высоко, тело одной линией',slow:true,

    const i=raw.indexOf('{'), j=raw.lastIndexOf('}');
    if (i<0||j<i) throw new Error('Не нашёл план. Скопируй блок целиком, от «{» до «}».');
    let obj; try{ obj=JSON.parse(raw.slice(i,j+1)); }catch(e){ throw new Error('Текст обрезан или изменён. Скопируй блок из чата ещё раз целиком.'); }
    if (obj.templates){ LS.set('templates', Object.assign(LS.get('templates')||{}, obj.templates));
      if (!obj.exercises && !obj.plan && !obj.logs){ draft=null; return 'Программа обновлена.'; } }
    if (obj.plan || obj.logs){
      if (obj.logs){ const arr=Array.isArray(obj.logs)?obj.logs:Object.values(obj.logs);
        arr.forEach(d=>{ if(d&&d.date&&Array.isArray(d.exercises)) logs[d.date]=d; }); LS.set('logs',logs); }
      if (obj.plan) obj = obj.plan; else return 'Записи восстановлены.';
    }
    if (!Array.isArray(obj.exercises)) throw new Error('В плане нет списка упражнений.');
    plan = obj; LS.set('plan', plan);
    if (!logs[TODAY]){ draft=null; dirty=false; LS.set('draft-'+TODAY,null); }
    return 'План «'+(plan.title||'')+'» загружен. Он во вкладке «Сегодня».';
  }
  $('#view-coach').addEventListener('click', async ev=>{
    const p = ev.target.closest('[data-p]'); if (p){ period=p.dataset.p; renderCoach(); return; }
    const b = ev.target.closest('[data-c]'); if (!b) return;
    const c = b.dataset.c, text = exportText();
    if (c==='share'){
      try{ await navigator.share({title:'Лог тренировок', text}); markExported(); setCoachMsg('Отправлено.','ok'); }
      catch(e){ if(e && e.name!=='AbortError') setCoachMsg('Не получилось поделиться. Нажми «Скопировать».','err'); }
    } else if (c==='copy'){
      try{ await navigator.clipboard.writeText(text); markExported(); setCoachMsg('Скопировано. Вставь в чат с Claude.','ok'); }
      catch(e){ const t=$('#export-text'); t.focus(); t.select(); setCoachMsg('Текст выделен. Скопируй его вручную.',''); }
    } else if (c==='file'){
      download('trenirovki-'+TODAY+'.txt', text); markExported(); setCoachMsg('Файл сохранён. Прикрепи его в чат с Claude.','ok');
    } else if (c==='backup'){
      download('trenirovki-backup-'+TODAY+'.json', JSON.stringify({plan, logs}, null, 1)); setCoachMsg('Копия сохранена.','ok');
    } else if (c==='import'){
      try{ const msg=applyImport($('#import-text').value); setCoachMsg(msg,'ok'); renderAll(); renderToday(); }
      catch(e){ setCoachMsg(e.message,'err'); }
      return;
    }
    const keep = coachMsg; renderCoach(); setCoachMsg(keep[0], keep[1]);
  });

  /* ---------- offline program: built-in templates + auto-progression ---------- */
  const BUILTIN = {
    A:{title:'Силовая A',duration:'≈20 мин',note:'Разминка 3 мин, отдых между подходами 45–60 сек.',exercises:[
      {name:'Гоблет-присед с гантелью',fig:'squat',unit:'повт',setCount:3,reps:10,step:1,cap:15,suffix:'',tip:'Гантель у груди, спина прямая, колени смотрят туда же, куда носки.'},
      {name:'Отжимания',fig:'pushup',unit:'повт',setCount:3,reps:10,step:1,cap:20,suffix:'',tip:'С носков. Тело прямой линией, грудь почти до пола.'},
      {name:'Тяга гантели в наклоне',fig:'row',unit:'повт',setCount:3,reps:12,step:1,cap:15,suffix:' на руку',tip:'Локоть к поясу, вверху задержись на секунду.'},
      {name:'Румынская тяга с гантелями',fig:'rdl',unit:'повт',setCount:3,reps:10,step:1,cap:15,suffix:'',tip:'Таз назад, спина прямая, гантели вдоль ног до середины голени.'},
      {name:'Планка на локтях',fig:'plank',unit:'сек',setCount:3,reps:30,step:5,cap:60,suffix:' сек',tip:'Ягодицы сжаты, живот подтянут.'}]},
    B:{title:'Силовая B',duration:'≈20 мин',note:'Разминка 3 мин, отдых между подходами 45–60 сек.',exercises:[
      {name:'Выпады назад с гантелями',fig:'lunge',unit:'повт',setCount:3,reps:8,step:1,cap:12,suffix:' на ногу',tip:'Опускайся вертикально, переднее колено над стопой.'},
      {name:'Отжимания',fig:'pushup',unit:'повт',setCount:3,reps:10,step:1,cap:20,suffix:'',tip:'С носков. Тело прямой линией, грудь почти до пола.'},
      {name:'Румынская тяга с гантелями',fig:'rdl',unit:'повт',setCount:3,reps:10,step:1,cap:15,suffix:'',tip:'Таз назад, спина прямая, гантели вдоль ног до середины голени.'},
      {name:'Тяга гантели в наклоне',fig:'row',unit:'повт',setCount:3,reps:12,step:1,cap:15,suffix:' на руку',tip:'Локоть к поясу, вверху задержись на секунду.'},
      {name:'Боковая планка',fig:'sideplank',unit:'сек',setCount:2,reps:20,step:5,cap:45,suffix:' сек на сторону',tip:'Таз высоко, тело одной линией. Можно с колена.'}]},
    core:{title:'Кор и баланс',duration:'≈15 мин',note:'Медленно и под контролем, отдых 30–40 сек.',exercises:[
      {name:'Разминка: марш на месте',fig:'march',unit:'сек',setCount:2,reps:60,suffix:' сек',tip:'Колени высоко, руки работают.'},
      {name:'Мёртвый жук',fig:'deadbug',unit:'повт',setCount:3,reps:8,step:1,cap:12,suffix:' на сторону',tip:'Поясница прижата к полу, выдох на усилии.'},
      {name:'Птица-собака',fig:'birddog',unit:'повт',setCount:3,reps:8,step:1,cap:12,suffix:' на сторону',tip:'Вверху задержись на 2 секунды.'},
      {name:'Боковая планка',fig:'sideplank',unit:'сек',setCount:2,reps:20,step:5,cap:45,suffix:' сек на сторону',tip:'Таз высоко, тело одной линией. Можно с колена.'},
      {name:'Планка на локтях',fig:'plank',unit:'сек',setCount:2,reps:30,step:5,cap:60,suffix:' сек',tip:'Ягодицы сжаты, живот подтянут.'}]},
    run:{title:'Лёгкий бег',duration:'≈25 мин',note:'Пульс до 150, темп такой, чтобы можно было говорить. Выше — переходи на шаг. Запиши пробежку на часах как «Бег».',exercises:[
      {name:'Разминка: быстрый шаг',fig:'march',unit:'мин',setCount:1,reps:5,targetText:'5 мин',tip:'Разогрейся перед бегом.'},
      {name:'Бег 2 мин + шаг 1 мин',fig:'run',unit:'мин бега',setCount:6,reps:2,targetText:'6 раундов',tip:'Отмечай каждый раунд галочкой.'},
      {name:'Заминка: шаг',fig:'march',unit:'мин',setCount:1,reps:3,targetText:'3 мин',tip:'Дай пульсу успокоиться.'}]},
    mobility:{title:'Прогулка и мобильность',duration:'≈40 мин',note:'Лёгкий день: двигаемся, но без нагрузки.',exercises:[
      {name:'Прогулка',fig:'march',unit:'мин',setCount:1,reps:30,targetText:'30+ мин',tip:'Обычным бодрым шагом.'},
      {name:'Птица-собака',fig:'birddog',unit:'повт',setCount:2,reps:8,suffix:' на сторону',tip:'Медленно, для спины.'},
      {name:'Мёртвый жук',fig:'deadbug',unit:'повт',setCount:2,reps:8,suffix:' на сторону',tip:'Медленно, поясница прижата.'}]}
  };
  function templates(){ return Object.assign({}, BUILTIN, LS.get('templates')||{}); }
  function typeFor(){
    const wd = WD[new Date().getDay()];
    const w = plan && Array.isArray(plan.week) && plan.week.find(x=>x.day===wd);
    if (w){ if (w.type) return w.type; const f = w.focus||'';
      if (/бег/i.test(f)) return 'run'; if (/кор|баланс/i.test(f)) return 'core';
      if (/прогулк|растяж|мобильн|отдых/i.test(f)) return 'mobility'; if (/B/.test(f)) return 'B'; return 'A'; }
    return {'Пн':'mobility','Вт':'run','Ср':'core','Чт':'A','Пт':'B','Сб':'run','Вс':'A'}[wd];
  }
  function lastFor(name){
    const ds = Object.keys(logs).filter(d=>d<TODAY).sort().reverse();
    for (const d of ds){ const e=(logs[d].exercises||[]).find(x=>x.name===name); if (e) return {e, feeling: logs[d].feeling||''}; }
    return null;
  }
  function fmt(x){ return x.targetText || (x.setCount+' × '+x.reps+(x.suffix||'')); }
  function progress(t){
    const x = Object.assign({}, t), L = lastFor(t.name);
    if (L) x.weight = L.e.weight||'';
    if (!L || !t.step){ x.target = fmt(x); return x; }
    const sets = L.e.sets||[], vals = sets.map(s=>Number(s.v)||0);
    const allDone = sets.length>0 && sets.every(s=>s.done), top = Math.max(...vals, 0), f = Number(L.feeling)||0;
    let msg;
    if (allDone && f<=3){
      if (t.cap && top>=t.cap){ x.reps = top; msg = 'Ты дошёл до '+top+'. Пора взять вес тяжелее или усложнить вариант и вернуться к '+t.reps+'.'; }
      else { x.reps = top + t.step; msg = 'Прошлый раз '+vals.join(', ')+', сегодня '+x.reps+'.'; }
    } else if (allDone){ x.reps = top; msg = 'Прошлый раз было тяжело, закрепляем '+top+'.'; }
    else { x.reps = top||t.reps; msg = 'Прошлый раз не все подходы сделаны, повторяем '+x.reps+'.'; }
    x.tip = msg+' '+(t.tip||''); x.target = fmt(x); return x;
  }
  function getActive(){
    if (plan && plan.date===TODAY) return plan;
    const type = typeFor(), T = templates()[type] || templates().A;
    return { date: TODAY, auto: true, type, title: T.title, duration: T.duration,
      dayLabel: 'Автоплан · '+WDL[new Date().getDay()],
      note: (T.note||'')+' Приложение собрало план само по программе тренера: где в прошлый раз было легко, нагрузка уже добавлена.',
      exercises: T.exercises.map(progress), week: plan && plan.week, rules: plan && plan.rules };
  }

  /* ---------- boot ---------- */
  plan = LS.get('plan') || DEFAULT_PLAN;
  const stored = LS.get('logs');
  logs = stored || SEED_LOGS;
  if (!stored){ LS.set('logs', logs); LS.set('plan', plan); LS.set('lastExport', new Date().toISOString()); }
  renderAll();
  if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
