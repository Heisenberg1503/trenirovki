<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Грамматика">
<meta name="theme-color" content="#EEF2F3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Грамматика английского</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column; unit list by book section, each unit opens a short rule card and a one-question-per-screen drill */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#152226; --muted:#5B6B70; --line:#D6DFE1;
  --accent:#126E82; --accent-ink:#FFFFFF; --accent-soft:#DCEFF3; --good:#1F7A55; --good-soft:#DDEFE5; --bad:#B4400E; --bad-soft:#F8E4DA;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172124; --ink:#E5EEF0; --muted:#93A6AB; --line:#26363A;
  --accent:#5FC6D9; --accent-ink:#06191E; --accent-soft:#173840; --good:#5CC497; --good-soft:#1E3529; --bad:#F0A060; --bad-soft:#3A2618; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172124; --ink:#E5EEF0; --muted:#93A6AB; --line:#26363A;
  --accent:#5FC6D9; --accent-ink:#06191E; --accent-soft:#173840; --good:#5CC497; --good-soft:#1E3529; --bad:#F0A060; --bad-soft:#3A2618; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15}
.links{display:flex;gap:12px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.list{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
.btn{border:1px solid var(--ink);background:none;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%;padding:15px;font-size:17px}
.btn.small{padding:6px 10px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1 1 130px}

/* unit list */
.sec h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.units{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.urow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.urow:first-child{border-top:0}
.urow .no{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.urow.done .no{color:var(--accent)}
.urow b{display:block;font-weight:700;line-height:1.3}
.urow small{color:var(--muted);font-size:13px}
.score{font-family:var(--f-num);font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
.score.full{background:var(--accent);color:var(--accent-ink)}
.overall{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* theory */
.back{align-self:flex-start}
.unit-h .no{font-family:var(--f-display);font-size:14px;color:var(--accent);font-weight:700}
.unit-h h2{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.2}
.unit-h .tag{color:var(--muted);font-weight:600}
.theory{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.theory p{margin:0}
.theory h4{font-size:15px;margin-top:6px}
.theory ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.theory i{color:var(--ink)}
.theory .f{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-weight:600;text-align:center;overflow-wrap:anywhere}
.theory .note{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.forms{border-collapse:collapse;width:100%;font-size:15px}
.forms td,.forms th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.forms th{background:var(--bg);font-size:13px}
.tablewrap{overflow-x:auto}

/* drill */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;gap:8px;min-height:140px;justify-content:center}
.qcard .q{font-size:20px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.qcard .q u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 18px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:15px;text-align:left;font-size:17px;font-weight:600}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fillrow{display:flex;gap:8px}
.fillrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-size:18px}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .big{font-family:var(--f-display);font-size:44px}
.mist{display:flex;flex-direction:column;gap:8px}
.mist div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.mist i{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Компаньон к English Grammar in Use</div>
    <h1>Грамматика</h1>
    <nav class="links"><a href="../slova/">Слова →</a><a href="../privychki/">Привычки →</a><a href="../">Тренировки →</a></nav>
  </header>
  <main id="view" class="list"></main>
</div>
<script src="units.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const TODAY = ymd(new Date());
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1==1)return a;return c;};
  const raw = k => { try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
  const put = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  let prog = raw('gr-progress') || {};   // {n: {best, last, read, date}}
  const save = () => put('gr-progress', prog);
  const U = n => UNITS.find(u=>u.n===n);

  /* ---------- list ---------- */
  function renderList(){
    const done = UNITS.filter(u=>(prog[u.n]||{}).best===u.ex.length).length;
    let h = `<div class="panel"><div class="overall"><b class="num">${done}/${UNITS.length}</b><div class="bar"><i style="width:${Math.round(done/UNITS.length*100)}%"></i></div></div>
      <p class="hint">Номера юнитов совпадают с книгой. Юнит засчитан, когда все упражнения решены без ошибок.</p>
      ${lastUnit()?`<button class="btn acc" data-open="${lastUnit()}">Продолжить: юнит ${lastUnit()}</button>`:''}</div>`;
    SECTIONS.forEach(s=>{
      h += `<div class="sec"><h2><span>${esc(s.title)}</span><span>${esc(s.ru)}</span></h2><div class="units">`;
      s.units.forEach(n=>{ const u=U(n), p=prog[n]||{}, full = p.best===u.ex.length;
        h += `<button class="urow${full?' done':''}" data-open="${n}"><span class="no">${n}</span><span><b>${esc(u.title)}</b><small>${esc(u.tag)}</small></span>
          <span class="score${full?' full':''}">${p.best!=null?p.best+'/'+u.ex.length:'—'}</span></button>`; });
      h += `</div></div>`;
    });
    h += `<p class="hint">Пока готов первый раздел. Следующие добавлю по порядку книги.</p>`;
    $('#view').innerHTML = h; window.scrollTo(0,0);
  }
  function lastUnit(){
    const next = UNITS.find(u=>(prog[u.n]||{}).best!==u.ex.length);
    return Object.keys(prog).length ? (next ? next.n : null) : null;
  }

  /* ---------- unit ---------- */
  function renderUnit(n){
    const u = U(n), p = prog[n] || {};
    $('#view').innerHTML = `<button class="btn small back" data-act="list">← Все юниты</button>
      <div class="unit-h"><div class="no">Юнит ${n}</div><h2>${esc(u.title)}</h2><div class="tag">${esc(u.tag)}</div></div>
      <div class="theory">${u.theory.replace(/<table/g,'<div class="tablewrap"><table').replace(/<\/table>/g,'</table></div>')}</div>
      <button class="btn acc wide" data-drill="${n}">Упражнения · ${u.ex.length}</button>
      ${p.best!=null?`<p class="hint" style="text-align:center">Лучший результат: ${p.best}/${u.ex.length}</p>`:''}
      ${UNITS.some(x=>x.n===n+1)?`<button class="btn" data-open="${n+1}">Юнит ${n+1} →</button>`:''}`;
    window.scrollTo(0,0);
  }

  /* ---------- drill ---------- */
  let D = null;  // {n, items, i, right, wrong:[], answered, t0}
  const norm = s => s.toLowerCase().replace(/[’`´]/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
  function startDrill(n){ const u=U(n); D = {n, items: shuffle(u.ex), i:0, right:0, wrong:[], answered:null, t0:Date.now()}; renderDrill(); }
  function qHTML(q){ return esc(q).replace('___','<u>&nbsp;</u>'); }
  function renderDrill(){
    const e = D.items[D.i], tot = D.items.length;
    let h = `<div class="topbar"><button class="btn small" data-act="quit">Выйти</button><div class="prog"><i style="width:${Math.round(D.i/tot*100)}%"></i></div><span class="num">${D.i+1}/${tot}</span></div>
      <div class="qcard"><span class="eyebrow">${e.t==='fill'?'Впиши форму':'Выбери вариант'}</span><div class="q">${qHTML(e.q)}</div></div>`;
    if (e.t==='choice'){
      h += `<div class="opts">${e.o.map((o,k)=>{ let c=''; if (D.answered){ if(k===e.a) c=' right'; else if(k===D.answered.k) c=' wrong'; }
        return `<button class="opt${c}" data-k="${k}" ${D.answered?'disabled':''}>${esc(o)}</button>`; }).join('')}</div>`;
    } else {
      h += D.answered ? '' : `<div class="fillrow"><input id="fill" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ответ" aria-label="Ответ"><button class="btn acc" data-act="check">Проверить</button></div>`;
    }
    if (D.answered){
      const ok = D.answered.ok;
      h += `<div class="fb ${ok?'good':'bad'}"><b>${ok?'Верно!':'Правильно: '+esc(e.t==='fill'?e.a[0]:e.o[e.a])}</b>${!ok&&e.t==='fill'?'Ты написал: «'+esc(D.answered.text||'—')+'». ':''}${esc(e.why)}</div>
        <button class="btn acc wide" data-act="next">${D.i+1<tot?'Дальше':'Результат'}</button>`;
    }
    $('#view').innerHTML = h;
    const f = $('#fill'); if (f) f.focus();
  }
  function answer(ok, extra){
    const e = D.items[D.i]; D.answered = Object.assign({ok}, extra||{});
    if (ok) D.right++; else D.wrong.push({q:e.q, a: e.t==='fill'?e.a[0]:e.o[e.a], why:e.why});
    renderDrill();
  }
  function finishDrill(){
    const u = U(D.n), tot = D.items.length, secs = Math.round((Date.now()-D.t0)/1000);
    const p = prog[D.n] || {}; p.last = D.right; p.best = Math.max(p.best||0, D.right); p.date = TODAY; prog[D.n] = p; save();
    const habit = logToHabit(secs, D.n);
    const perfect = D.right===tot;
    $('#view').innerHTML = `<div class="panel result"><span class="eyebrow">Юнит ${D.n} · ${esc(u.title)}</span><div class="big num">${D.right}/${tot}</div>
        <p class="hint">${perfect?'Без ошибок, юнит засчитан.':'Повтори ошибки ниже и пройди ещё раз.'} ${habit}</p></div>
      ${D.wrong.length?`<div class="mist">${D.wrong.map(w=>`<div>${qHTML(w.q)}<br><b>${esc(w.a)}</b> · <i>${esc(w.why)}</i></div>`).join('')}</div>`:''}
      <div class="btnrow"><button class="btn" data-drill="${D.n}">Ещё раз</button>${perfect && UNITS.some(x=>x.n===D.n+1)?`<button class="btn acc" data-open="${D.n+1}">Юнит ${D.n+1} →</button>`:`<button class="btn acc" data-open="${D.n}">К правилу</button>`}</div>
      <button class="btn" data-act="list">Все юниты</button>`;
    D = null; window.scrollTo(0,0);
  }
  function logToHabit(secs, n){
    if (secs < 30) return '';
    const habits = raw('hab-habits'); if (!Array.isArray(habits)) return '';
    const h = habits.find(x=>x.id==='english') || habits.find(x=>/англ/i.test(x.name||'')); if (!h) return '';
    const mins = Math.max(1, Math.round(secs/60)), sessions = raw('hab-sessions')||[], marks = raw('hab-marks')||{};
    const isMin = h.kind==='count' && /мин/i.test(h.unit||''), day = (marks[TODAY] ||= {});
    if (isMin) day[h.id] = (day[h.id]||0)+mins; else if (h.kind==='count') day[h.id]=(day[h.id]||0)+(h.step||1); else day[h.id]=1;
    sessions.push({id:'s'+Date.now().toString(36), hid:h.id, name:h.name, date:TODAY, start:Date.now()-secs*1000, secs, note:'Грамматика: юнит '+n, added:isMin?mins:0});
    put('hab-marks', marks); put('hab-sessions', sessions);
    return 'Записал '+mins+' мин в «'+h.name+'».';
  }

  /* ---------- events ---------- */
  $('#view').addEventListener('click', ev=>{
    const o = ev.target.closest('[data-open]'); if (o){ renderUnit(+o.dataset.open); return; }
    const d = ev.target.closest('[data-drill]'); if (d){ startDrill(+d.dataset.drill); return; }
    const k = ev.target.closest('[data-k]'); if (k && D && !D.answered){ const kk=+k.dataset.k; answer(kk===D.items[D.i].a, {k:kk}); return; }
    const a = ev.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act==='list') renderList();
    if (a.dataset.act==='quit'){ const n=D.n; D=null; renderUnit(n); }
    if (a.dataset.act==='check' && D){ const t=$('#fill').value; if(!t.trim()){ $('#fill').focus(); return; } answer(D.items[D.i].a.some(x=>norm(x)===norm(t)), {text:t}); }
    if (a.dataset.act==='next' && D){ D.i++; D.answered=null; if (D.i>=D.items.length) finishDrill(); else renderDrill(); }
  });
  $('#view').addEventListener('keydown', ev=>{ if (ev.target.id==='fill' && ev.key==='Enter'){ ev.preventDefault(); document.querySelector('[data-act="check"]').click(); } });

  renderList();
  if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
